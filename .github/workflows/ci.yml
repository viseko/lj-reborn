name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v7

      - name: Поставить pnpm
        uses: pnpm/action-setup@v6

      - name: Поставить Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Линт
        run: pnpm lint

      - name: Проверка форматирования
        run: pnpm format:check

      - name: Генерация Prisma
        run: pnpm --filter @lj/backend exec prisma generate

      - name: Типы Next
        run: pnpm --filter @lj/frontend exec next typegen

      - name: Тайпчек
        run: pnpm -r exec tsc --noEmit

      - name: Stylelint
        run: pnpm --filter @lj/frontend lint:scss
