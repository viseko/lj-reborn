name: CI
on: [push, pull_request]
jobs:
  checks:
    env:
      DATABASE_URL: postgresql://dagone_test:postgres@localhost:5432/dagone_test
      DATABASE_URL_TEST: postgresql://dagone_test:postgres@localhost:5432/dagone_test
      DATABASE_URL_E2E: postgresql://dagone_test:postgres@localhost:5432/dagone_test
      JWT_ACCESS_PRIVATE_KEY: ${{ secrets.JWT_ACCESS_PRIVATE_KEY }}
      JWT_ACCESS_PUBLIC_KEY: ${{ secrets.JWT_ACCESS_PUBLIC_KEY }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dagone_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dagone_test
        ports:
          - 5432:5432
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Prisma generation
        run: pnpm --filter @lj/backend exec prisma generate

      - name: Next.js types generation
        run: pnpm --filter @lj/frontend exec next typegen

      - name: Type check
        run: pnpm -r exec tsc --noEmit

      - name: Stylelint
        run: pnpm --filter @lj/frontend lint:scss

      - name: Prisma migrations
        run: pnpm --filter @lj/backend exec prisma migrate deploy

      - name: Test backend
        run: pnpm test:back

      - name: Test shared
        run: pnpm test:shared

      - name: Install Playwright
        run: pnpm --filter @lj/e2e exec playwright install --with-deps chromium

      - name: Test E2E
        run: pnpm test:e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/dagone
          chmod 600 ~/.ssh/dagone
          ssh-keyscan -H 889592.cloud4box.ru >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/dagone -o BatchMode=yes dagone@889592.cloud4box.ru 'bash -s' << 'EOF'
          set -euo pipefail
          cd "$HOME/lj-reborn"
          git pull --ff-only
          pnpm install --frozen-lockfile
          pnpm --filter @lj/backend exec prisma generate
          pnpm --filter @lj/backend exec prisma migrate deploy
          NEXT_PUBLIC_API_URL=https://api.dagone.ru pnpm --filter @lj/frontend build
          pm2 reload ecosystem.config.cjs --update-env
          EOF
